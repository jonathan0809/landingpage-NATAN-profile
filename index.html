<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yonathan Mapandin — Profil</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:clamp(16px,4vw,48px);
    color:#0f172a;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 600px at 12% 0%, rgba(56,189,248,.20), transparent 60%),
      radial-gradient(800px 600px at 100% 100%, rgba(99,102,241,.22), transparent 60%),
      #0b1220;
    -webkit-user-select:none;
    user-select:none;
  }

  .card{
    width:min(940px,100%);
    background:#fff;
    border-radius:26px;
    padding:clamp(26px,4vw,52px);
    box-shadow:0 40px 80px -30px rgba(2,6,23,.8), 0 0 0 1px rgba(255,255,255,.06);
    animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
    position:relative;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  /* ---------- Watermark overlay ---------- */
  .watermark{
    position:absolute;inset:0;pointer-events:none;
    display:grid;place-items:center;z-index:5;
    opacity:.045;overflow:hidden;border-radius:26px;
  }
  .watermark span{
    font-size:clamp(14px,3.4vw,28px);font-weight:800;
    letter-spacing:.3em;text-transform:uppercase;color:#0f172a;
    white-space:nowrap;transform:rotate(-24deg);
    line-height:2.4;display:block;text-align:center;
  }

  /* ---------- Profile layout ---------- */
  .profile{
    display:grid;
    grid-template-columns:250px 1fr;
    gap:clamp(24px,4vw,48px);
    align-items:center;
    position:relative;z-index:6;
  }

  /* ---------- Photo (from local file) ---------- */
  .photo-slot{
    position:relative;
    width:100%;max-width:250px;aspect-ratio:3/4;
    border-radius:20px;overflow:hidden;
    background:linear-gradient(180deg,#f8fafc,#eef2f7);
    border:1px solid #e2e8f0;
    box-shadow:0 20px 40px -22px rgba(15,23,42,.35);
  }
  .photo-slot img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;display:block;
  }
  .photo-slot .fallback{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:14px;text-align:center;
    color:#94a3b8;font-size:.8rem;font-weight:500;
  }
  .photo-slot .fallback svg{width:52px;height:52px;color:#b6c2d1}
  .photo-slot .fallback small{font-size:.68rem;color:#a8b4c4;font-weight:400;letter-spacing:.02em}

  /* ---------- Info ---------- */
  .eyebrow{
    font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:#2563eb;margin-bottom:10px;
  }
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.15;letter-spacing:-.02em}

  .nip-row{
    margin-top:18px;display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;padding:9px 10px 9px 16px;
  }
  .nip-label{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#64748b}
  .nip-value{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:1rem;font-weight:600;letter-spacing:.06em;
  }
  .copy-btn{
    border:0;font:inherit;font-size:.75rem;font-weight:600;color:#fff;background:#2563eb;
    padding:7px 14px;border-radius:9px;cursor:pointer;transition:background .2s, transform .15s;
  }
  .copy-btn:hover{background:#1d4ed8}
  .copy-btn:active{transform:scale(.96)}
  .copy-btn.done{background:#16a34a}

  /* ---------- Signature (from local file) ---------- */
  .sign-area{
    margin-top:clamp(28px,4vw,44px);padding-top:clamp(22px,3vw,32px);
    border-top:1px solid #eef2f7;display:flex;flex-direction:column;align-items:flex-end;gap:9px;
    position:relative;z-index:6;
  }
  .sig-slot{
    position:relative;
    width:280px;max-width:100%;height:130px;
    border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,#f8fafc,#eef2f7);
    border:1px solid #e2e8f0;
  }
  .sig-slot img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:contain;padding:10px;display:block;
  }
  .sig-slot .fallback{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;padding:14px;text-align:center;
    color:#94a3b8;font-size:.8rem;font-weight:500;
  }
  .sig-slot .fallback svg{width:130px;height:44px;color:#c3cedb}
  .sig-slot .fallback small{font-size:.68rem;color:#a8b4c4}
  .sig-caption{font-size:.72rem;color:#94a3b8;letter-spacing:.04em;padding-right:4px}

  @media (max-width:700px){
    .profile{grid-template-columns:1fr;justify-items:center;text-align:center}
    .photo-slot{max-width:210px}
    .nip-row{justify-content:center}
    .sign-area{align-items:center}
  }

  /* ============================================================
     SCREENSHOT SHIELD
     ============================================================ */
  body.shield .card{
    filter:blur(24px) !important;
  }
  body.shield::after{
    content:"🔒 Konten dilindungi";
    position:fixed;inset:0;display:grid;place-items:center;
    background:#0b1220;
    color:#fff;font-size:1.05rem;font-weight:700;letter-spacing:.04em;
    z-index:99999;text-align:center;padding:24px;
  }
</style>
</head>

<body>

<main class="card" id="card">

  <!-- Watermark (survives screenshots) -->
  <div class="watermark" aria-hidden="true">
    <span>
      YONATHAN MAPANDIN<br>
      199709082025211033<br>
      YONATHAN MAPANDIN<br>
      199709082025211033<br>
      YONATHAN MAPANDIN
    </span>
  </div>

  <div class="profile">

    <!-- ===== PHOTO (local file) ===== -->
    <div class="photo-slot">
      <div class="fallback" id="photoFallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4.5 21c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5"/>
        </svg>
        <span>Foto</span>
        <small>Letakkan "photo.jpg" di folder yang sama</small>
      </div>
      <!-- Ganti nama file di bawah sesuai file Anda -->
      <img src="photo.png" alt="Foto Yonathan Mapandin"
           onerror="this.style.display='none'">
    </div>

    <!-- ===== INFO ===== -->
    <div class="info">
      <p class="eyebrow">Profil Pegawai</p>
      <h1>Yonathan Mapandin</h1>

      <div class="nip-row">
        <span class="nip-label">NIP</span>
        <span class="nip-value" id="nipValue">199709082025211033</span>
        <button class="copy-btn" id="copyBtn" type="button">Salin</button>
      </div>
    </div>

  </div>

  <!-- ===== SIGNATURE (local file) ===== -->
  <div class="sign-area">
    <div class="sig-slot">
      <div class="fallback">
        <svg viewBox="0 0 200 60" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 46 C 24 8, 36 8, 41 34 S 51 56, 61 30 S 76 4, 86 30 S 96 52, 111 28 S 131 6, 146 32 S 166 46, 192 18"/>
        </svg>
        <small>Letakkan "signature.png" di folder yang sama</small>
      </div>
      <!-- Ganti nama file di bawah sesuai file Anda -->
      <img src="signature.png" alt="Tanda Tangan"
           onerror="this.style.display='none'">
    </div>
    <p class="sig-caption">Tanda Tangan</p>
  </div>

</main>

<script>
/* ============================================================
   1. COPY NIP
   ============================================================ */
const copyBtn = document.getElementById('copyBtn');
const nipValue = document.getElementById('nipValue').textContent.trim();
copyBtn.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(nipValue); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = nipValue; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  copyBtn.textContent = 'Tersalin ✓';
  copyBtn.classList.add('done');
  setTimeout(() => {
    copyBtn.textContent = 'Salin';
    copyBtn.classList.remove('done');
  }, 1600);
});

/* ============================================================
   2. SCREENSHOT SHIELD (best-effort)
   ============================================================ */
(function(){
  const body = document.body;
  let shieldTimer = null;

  function engage(){ body.classList.add('shield'); }
  function release(){
    clearTimeout(shieldTimer);
    shieldTimer = setTimeout(() => body.classList.remove('shield'), 400);
  }
  function hold(ms){
    body.classList.add('shield');
    clearTimeout(shieldTimer);
    shieldTimer = setTimeout(() => body.classList.remove('shield'), ms);
  }

  // Clear clipboard on PrintScreen
  document.addEventListener('keyup', (e) => {
    if (e.key === 'PrintScreen' || e.code === 'PrintScreen' || e.keyCode === 44){
      hold(1500);
      try { navigator.clipboard.writeText('').catch(()=>{}); } catch(_) {}
      try {
        const ta = document.createElement('textarea');
        ta.style.position='fixed'; ta.style.opacity='0'; ta.value='';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      } catch(_) {}
    }
  });

  // Instant blur on keydown
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k === 'PrintScreen' || e.code === 'PrintScreen' || e.keyCode === 44){ engage(); return; }
    if (e.metaKey && e.shiftKey && ['3','4','5','6'].includes(k)){ engage(); return; }
    if (e.ctrlKey && e.shiftKey && (k === 'S' || k === 's')){ engage(); return; }
  }, true);

  // Window blur / focus
  window.addEventListener('blur', () => { if (!document.hidden) engage(); });
  window.addEventListener('focus', release);

  // Tab hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) engage(); else release();
  });

  // Print / Save PDF
  window.addEventListener('beforeprint', () => hold(8000));
  if (window.matchMedia){
    window.matchMedia('print').addEventListener('change', m => { if (m.matches) hold(8000); });
  }

  // Right-click + Ctrl/Cmd + S / P
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')){
      e.preventDefault(); engage(); setTimeout(release, 500);
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 'P')){
      e.preventDefault(); hold(1500);
    }
  });

  // Dismiss on click
  document.addEventListener('click', () => {
    if (body.classList.contains('shield')) body.classList.remove('shield');
  });
})();
</script>

</body>
</html>
